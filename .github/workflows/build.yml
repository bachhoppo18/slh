# Workflow này đặt trong repo source PRIVATE. Mỗi tag v1.0.0 sẽ build bộ cài
# và chỉ upload bộ cài sang repo PUBLIC bachhoppo18/slh.
#
# Cách phát hành: commit thay đổi lên main của slh-source, tạo tag mới, rồi chỉ
# đẩy tag lên remote của slh-source (không đẩy mã nguồn lên repo public slh).
#   git push private main
#   git tag v1.0.10
#   git push private v1.0.10
#
# Sau khoảng 3-5 phút, vào tab "Actions" của repo xem tiến trình build. Xong sẽ
# tự tạo 1 "Release" mới ở tab "Releases" kèm bộ cài và các từ điển.
name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # cho phép bấm nút "Run workflow" trên GitHub để build thử, không cần tạo tag

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Xác định số phiên bản từ tag Git
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v\.?', ''
          } else {
            $v = "0.0.0-dev"    # chạy tay qua "Run workflow", không phải bản phát hành thật
          }
          if ($v -notmatch '^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') {
            throw "Tag phiên bản không hợp lệ: $v (dùng v1.2.3 hoặc v.1.2.3)"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Phiên bản build: $v"

      - name: Đồng bộ số phiên bản vào mã nguồn + bộ cài
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content slhtool.py -Raw) -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`"" |
            Set-Content slhtool.py -Encoding utf8
          (Get-Content installer.iss -Raw) -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$v`"" |
            Set-Content installer.iss -Encoding utf8
          $core = ($v -split '[-+]')[0]
          $parts = $core -split '\.'
          $filevers = "$($parts[0]), $($parts[1]), $($parts[2]), 0"
          $fileversion = "$core.0"
          (Get-Content version_info.txt -Raw) `
            -replace 'filevers=\([^)]*\)', "filevers=($filevers)" `
            -replace 'prodvers=\([^)]*\)', "prodvers=($filevers)" `
            -replace "FileVersion', u'[^']*'", "FileVersion', u'$fileversion'" `
            -replace "ProductVersion', u'[^']*'", "ProductVersion', u'$fileversion'" |
            Set-Content version_info.txt -Encoding utf8

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Build .exe (PyInstaller, chế độ onedir)
        run: pyinstaller slhtool.spec

      - name: Cài Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build bộ cài (Setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Tạo GitHub Release kèm bộ cài và từ điển
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: bachhoppo18/slh
          token: ${{ secrets.SLH_RELEASE_TOKEN }}
          target_commitish: main
          files: |
            Output/SLHTool_Setup.exe
            translate/Name.json
            translate/VP.json
            translate/HanViet.json
          generate_release_notes: true

      - name: Lưu file build (khi chạy thử bằng "Run workflow", không tạo Release)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: slhtool-build-thu
          path: Output/SLHTool_Setup.exe
